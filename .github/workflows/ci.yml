# CI vpn-zones: eval модуля, адресная сборка скриптов + shellcheck, смоук в
# непривилегированном userns. Подробности — tests/README.md.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Полный eval home-manager-конфигурации с модулем: падает на любой ошибке
  # вычисления module/default.nix. Ничего не собирает (только instantiate).
  eval:
    name: eval (nix-instantiate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Инстанцировать tests/harness.nix
        run: |
          nix-instantiate tests/harness.nix \
            -A activationPackage -A scripts -A zoneHolder -A smokeTools -A ocTools
          # строка ExecStart юнита vpn-zone@ должна вычисляться
          nix-instantiate --eval tests/harness.nix -A zoneHolderExec

  # Адресная сборка каждой script-деривации + shellcheck по собранным bin/*.
  #
  # Список из трёх — это итог M1: shell в модуле остался ровно обёртками над
  # бинарями крейта (vpn-zone, vpn-zone-pick — по две строки, vpn-zone-sync —
  # одна с четырьмя аргументами). Пикер и шесть GUI-ярлыков теперь бинари, их
  # проверяет job rust. Цикл и shellcheck остаются: обёртки — тоже код, и
  # смоук-скрипт проверяется здесь же.
  scripts:
    name: scripts (build + shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Собрать script-деривации адресно
        run: |
          set -euo pipefail
          mkdir -p results
          for s in vpn-zone vpn-zone-pick vpn-zone-sync; do
            echo "=== nix-build -A scripts.$s"
            nix-build tests/harness.nix -A "scripts.$s" -o "results/$s"
          done
      - name: shellcheck по собранным скриптам
        run: |
          set -euo pipefail
          files=(tests/integration/smoke.sh)
          for f in results/*/bin/*; do
            # Бинарники пропускаем: shellcheck только для текстов с шебангом.
            # Сейчас в списке одни обёртки, но проверка остаётся — положат сюда
            # бинарь, и job не покраснеет на пустом месте.
            if ! head -c 2 "$f" | grep -q '#!'; then
              echo "пропуск (не скрипт): $f"
              continue
            fi
            files+=("$f")
          done
          # --severity=warning: info/style в генерённых nix-скриптах — шум
          # (SC2015 «&& … || true» — нарочный идиом под set -e, SC2001/SC2002 —
          # стилистика). Предупреждения и ошибки — по делу, SC2086 включён.
          # Исключения:
          #  SC2088 — «~/.mozilla» в echo-тексте для человека, не путь;
          #  SC2064 — trap с раскрытием сразу: нарочно, фиксируются pid'ы
          #           уже запущенных фоновых процессов.
          shellcheck --severity=warning --exclude=SC2088,SC2064 "${files[@]}"
          echo "shellcheck: ok (${#files[@]} файлов)"

  # Rust-ядро (ROADMAP M1/M2): формат, линт и тесты крейта rust/ — парсер
  # конфигов WG/AWG, генератор seccomp-фильтра, слои профилей, генератор
  # .desktop-ярлыков, ограничитель доступа к композитору (wl-sandbox),
  # песочница файловой системы (fs-sandbox), CLI vpn-zone (разбор аргументов
  # запуска, реестр запусков, манифест путей инструментов), пикер сети
  # (машина выбора как чистая функция + сквозные сценарии с подставными
  # kdialog и vpn-zone) и шесть GUI-ярлыков.
  # В job scripts крейт тоже собирается (обёртки vpn-zone/vpn-zone-pick и
  # vpn-zone-sync на него ссылаются), но без clippy и без тестов: компилятор и
  # линтер живут здесь.
  #
  # Интеграционные тесты крейта, которым нужен настоящий bwrap, помечены
  # #[ignore]: userns на раннере готовит только job integration (снятие
  # AppArmor-запрета), а `cargo test` идёт здесь, без этой подготовки. Их
  # проверяет смоук — там окружение уже подходящее.
  #
  # Тесты wl-sandbox проверяют только fallback-пути (композитора на раннере
  # нет): окружение в них чистится нарочно, иначе на машине разработчика
  # результат отличался бы от CI.
  #
  # cargo test включает selftest фильтра: он грузит seccomp в собственный
  # процесс и проверяет, что keyctl отвечает EPERM. Прав для этого не нужно —
  # непривилегированный seccomp работает с NO_NEW_PRIVS, который libseccomp
  # ставит сам.
  rust:
    name: rust (fmt + clippy + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Оболочка — из harness (пин nixpkgs), не из `-p`: у раннера нет канала
      # <nixpkgs>, и пин избавляет от внезапной красноты при обновлении clippy.
      - name: cargo fmt --check
        run: nix-shell ../tests/harness.nix -A rustShell --run 'cargo fmt --check'
      - name: cargo clippy (предупреждения = ошибки)
        run: |
          nix-shell ../tests/harness.nix -A rustShell \
            --run 'cargo clippy --all-targets -- -D warnings'
      - name: cargo test
        run: nix-shell ../tests/harness.nix -A rustShell --run 'cargo test'

  # VM-тест (tests/vm.nix): qemu-машина с настоящим systemd и модулем + вторая
  # VM как живой WireGuard-пир. Закрывает то, до чего смоук не дотягивается
  # (нет systemctl --user на раннере): юнит vpn-zone@, автоподъём в run,
  # offline-ветку пикера — и первый leak-тест: tcpdump на физическом интерфейсе
  # клиента обязан остаться пустым. У раннеров GitHub есть /dev/kvm, но узел
  # по умолчанию закрыт для непривилегированных — правило udev из документации
  # GitHub открывает его; без KVM драйвер откатился бы на медленный TCG,
  # поэтому наличие узла проверяется явно.
  vm:
    name: vm (NixOS test, real tunnel)
    runs-on: ubuntu-24.04
    needs: eval
    steps:
      - uses: actions/checkout@v4
      - name: Включить KVM для раннера
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
      - uses: cachix/install-nix-action@v31
      - name: Собрать драйвер VM-теста
        run: nix-build tests/vm.nix -A driver -o vm-driver
      - name: Прогнать VM-тест
        run: ./vm-driver/bin/nixos-test-driver

  # Смоук: поднять настоящую зону в непривилегированном userns и проверить её
  # изнутри. Требует fallback на ядерный wireguard (amneziawg-модуля на
  # раннере нет) — см. tests/integration/smoke.sh.
  integration:
    name: integration (smoke, userns)
    runs-on: ubuntu-24.04
    needs: eval
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Подготовка раннера (userns, wireguard, subuid/subgid)
        run: |
          set -euo pipefail
          # Ubuntu ≥23.10 душит непривилегированные userns через AppArmor
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo modprobe wireguard
          test -c /dev/net/tun
          # setuid-помощники для двойного маппинга unshare --map-users
          if ! command -v newuidmap >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq uidmap
          fi
          u=$(id -un)
          grep -q "^$u:" /etc/subuid || sudo usermod --add-subuids 100000-165535 "$u"
          grep -q "^$u:" /etc/subgid || sudo usermod --add-subgids 100000-165535 "$u"
          echo "--- итог ---"
          grep "^$u:" /etc/subuid /etc/subgid
      - name: Смоук-тест
        # На раннере sudo без пароля есть всегда, поэтому часть про
        # OpenConnect-зону (ocserv под sudo в сети хоста) обязана отработать, а
        # не пропуститься: без этой переменной смоук на машине без sudo
        # честно её пропускает, а здесь такой пропуск был бы тихой дырой в CI.
        run: VPN_ZONE_SMOKE_REQUIRE_OC=1 tests/integration/smoke.sh
