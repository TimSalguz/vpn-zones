# CI vpn-zones: eval модуля, адресная сборка скриптов + shellcheck, смоук в
# непривилегированном userns. Подробности — tests/README.md.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Полный eval home-manager-конфигурации с модулем: падает на любой ошибке
  # вычисления module/default.nix. Ничего не собирает (только instantiate).
  eval:
    name: eval (nix-instantiate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Инстанцировать tests/harness.nix
        run: |
          nix-instantiate tests/harness.nix \
            -A activationPackage -A scripts -A zoneHolder -A smokeTools
          # строка ExecStart юнита vpn-zone@ должна вычисляться
          nix-instantiate --eval tests/harness.nix -A zoneHolderExec

  # Адресная сборка каждой script-деривации + shellcheck по собранным bin/*.
  scripts:
    name: scripts (build + shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Собрать script-деривации адресно
        run: |
          set -euo pipefail
          mkdir -p results
          for s in vpn-zone vpn-zone-pick vpn-zone-sync vpn-fs-sandbox \
                   vpn-zone-add-gui vpn-zone-remove-gui vpn-zone-profile-rm-gui \
                   vpn-zone-profile-add-gui vpn-zone-settings-gui \
                   vpn-zone-forget-gui wl-sandbox; do
            echo "=== nix-build -A scripts.$s"
            nix-build tests/harness.nix -A "scripts.$s" -o "results/$s"
          done
      - name: shellcheck по собранным скриптам
        run: |
          set -euo pipefail
          files=(tests/integration/smoke.sh)
          for f in results/*/bin/*; do
            # Бинарники (wl-sandbox — это C) пропускаем: shellcheck только для
            # текстов с шебангом.
            if ! head -c 2 "$f" | grep -q '#!'; then
              echo "пропуск (не скрипт): $f"
              continue
            fi
            files+=("$f")
          done
          # --severity=warning: info/style в генерённых nix-скриптах — шум
          # (SC2015 «&& … || true» — нарочный идиом под set -e, SC2001/SC2002 —
          # стилистика). Предупреждения и ошибки — по делу, SC2086 включён.
          # Исключения:
          #  SC2088 — «~/.mozilla» в echo-тексте для человека, не путь;
          #  SC2064 — trap с раскрытием сразу: нарочно, фиксируются pid'ы
          #           уже запущенных фоновых процессов.
          shellcheck --severity=warning --exclude=SC2088,SC2064 "${files[@]}"
          echo "shellcheck: ok (${#files[@]} файлов)"

  # Rust-ядро (ROADMAP M1/M2): формат, линт и тесты крейта rust/ — парсер
  # конфигов WG/AWG, генератор seccomp-фильтра, слои профилей и генератор
  # .desktop-ярлыков. В job scripts крейт тоже собирается (vpn-fs-sandbox и
  # vpn-zone-sync на него ссылаются), но без clippy и без тестов: компилятор и
  # линтер живут здесь.
  #
  # cargo test включает selftest фильтра: он грузит seccomp в собственный
  # процесс и проверяет, что keyctl отвечает EPERM. Прав для этого не нужно —
  # непривилегированный seccomp работает с NO_NEW_PRIVS, который libseccomp
  # ставит сам.
  rust:
    name: rust (fmt + clippy + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Оболочка — из harness (пин nixpkgs), не из `-p`: у раннера нет канала
      # <nixpkgs>, и пин избавляет от внезапной красноты при обновлении clippy.
      - name: cargo fmt --check
        run: nix-shell ../tests/harness.nix -A rustShell --run 'cargo fmt --check'
      - name: cargo clippy (предупреждения = ошибки)
        run: |
          nix-shell ../tests/harness.nix -A rustShell \
            --run 'cargo clippy --all-targets -- -D warnings'
      - name: cargo test
        run: nix-shell ../tests/harness.nix -A rustShell --run 'cargo test'

  # Смоук: поднять настоящую зону в непривилегированном userns и проверить её
  # изнутри. Требует fallback на ядерный wireguard (amneziawg-модуля на
  # раннере нет) — см. tests/integration/smoke.sh.
  integration:
    name: integration (smoke, userns)
    runs-on: ubuntu-24.04
    needs: eval
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Подготовка раннера (userns, wireguard, subuid/subgid)
        run: |
          set -euo pipefail
          # Ubuntu ≥23.10 душит непривилегированные userns через AppArmor
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo modprobe wireguard
          test -c /dev/net/tun
          # setuid-помощники для двойного маппинга unshare --map-users
          if ! command -v newuidmap >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq uidmap
          fi
          u=$(id -un)
          grep -q "^$u:" /etc/subuid || sudo usermod --add-subuids 100000-165535 "$u"
          grep -q "^$u:" /etc/subgid || sudo usermod --add-subgids 100000-165535 "$u"
          echo "--- итог ---"
          grep "^$u:" /etc/subuid /etc/subgid
      - name: Смоук-тест
        run: tests/integration/smoke.sh
