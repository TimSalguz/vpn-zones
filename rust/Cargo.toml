[package]
name = "vpn-zone"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rootless network zones: WireGuard/AmneziaWG config parsing and seccomp filters"
repository = "https://github.com/TimSalguz/vpn-zones"
publish = false

[lib]
name = "vpn_zone"
path = "src/lib.rs"

# The bash entry point is called `vpn-zone`, so the binary gets its own name to
# avoid a collision in `home.packages`.
[[bin]]
name = "vpn-zone-seccomp"
path = "src/bin/vpn-zone-seccomp.rs"

[dependencies]
# Bindings to the C libseccomp: a BPF filter can only be generated by code,
# which is the whole reason this crate exists (ROADMAP M2).
libseccomp = "0.4"
# Errno/ioctl/clone constants and the raw syscalls used by `selftest`.
libc = "0.2"
