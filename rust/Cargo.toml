[package]
name = "vpn-zone"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rootless network zones: config parsing, seccomp filters, data containers and .desktop generation"
repository = "https://github.com/TimSalguz/vpn-zones"
publish = false

[lib]
name = "vpn_zone"
path = "src/lib.rs"

# The bash entry point is called `vpn-zone`, so the binaries get their own names
# to avoid a collision in `home.packages`.
[[bin]]
name = "vpn-zone-seccomp"
path = "src/bin/vpn-zone-seccomp.rs"

# The helper commands the bash `vpn-zone` delegates to (`profile-run`, `sync`) —
# two former Python scripts of `module/`.
[[bin]]
name = "vpn-zone-core"
path = "src/bin/vpn-zone-core.rs"

[dependencies]
# Bindings to the C libseccomp: a BPF filter can only be generated by code,
# which is the whole reason this crate exists (ROADMAP M2).
libseccomp = "0.4"
# Errno/ioctl/clone constants and the raw syscalls used by `selftest`.
libc = "0.2"
