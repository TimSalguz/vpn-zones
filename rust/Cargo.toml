[package]
name = "vpn-zone"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rootless network zones: config parsing, seccomp filters, data containers and .desktop generation"
repository = "https://github.com/TimSalguz/vpn-zones"
publish = false

[lib]
name = "vpn_zone"
path = "src/lib.rs"

# The filter generator, which is also its own selftest.
[[bin]]
name = "vpn-zone-seccomp"
path = "src/bin/vpn-zone-seccomp.rs"

# The helper commands `vpn-zone` delegates to (`profile-run`, `sync`,
# `wl-sandbox`, `fs-sandbox`) — two former Python scripts, the former C program
# and the former shell sandbox of `module/`.
[[bin]]
name = "vpn-zone-core"
path = "src/bin/vpn-zone-core.rs"

# The command line itself, formerly the `writeShellScriptBin vpn-zone` of
# `module/default.nix`. It takes the name the users, the picker and the
# generated `.desktop` files already use; in `home.packages` the same name
# belongs to a two-line wrapper that points VPN_ZONE_TOOLS at the manifest and
# execs this, so the crate goes into the profile through a symlink farm of its
# helper binaries only (see `module/default.nix`).
[[bin]]
name = "vpn-zone"
path = "src/bin/vpn-zone.rs"

[dependencies]
# Bindings to the C libseccomp: a BPF filter can only be generated by code,
# which is the whole reason this crate exists (ROADMAP M2).
libseccomp = "0.4"
# Errno/ioctl/clone constants and the raw syscalls used by `selftest`,
# `profile-run` and `wl-sandbox`.
libc = "0.2"
# The compositor side of the sandbox (`wl-sandbox`). NOTE: no libwayland is
# linked in — `wayland-backend/client_system` is off by default, so
# wayland-client speaks the wire protocol from Rust and the Nix derivation
# needs no Wayland `buildInputs`. Do not enable that feature without adding
# `pkgs.wayland` to `module/default.nix`.
wayland-client = "0.31"
# `wp_security_context_v1` is a staging protocol, hence the feature; `client`
# generates the client half only.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
